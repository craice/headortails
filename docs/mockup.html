<title>Mockup Cara ou Coroa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap">
<style>
  /* Mockup estático, tema único proposital: o app só tem visual claro. */
  :root {
    --board: #2b2118;
    --board-text: #f6efe1;
    --board-muted: #b9a88f;
    --bg: #f6efe1;
    --ink: #2b2118;
    --muted: #7a6a58;
    --coin: #f7c531;
    --coin-dark: #e0a21b;
    --button: #e8553a;
    --button-text: #fffaf0;
    --outline: 4px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding-block: 40px 56px;
    padding-inline: 16px;
    background: var(--board);
    color: var(--board-text);
    font-family: "Fredoka", system-ui, sans-serif;
  }

  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  .board-head {
    max-width: 1000px;
    margin: 0 auto 36px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .board-head h1 { margin: 0; font-size: 1.6rem; font-weight: 700; }
  .board-head p { margin: 0; color: var(--board-muted); max-width: 60ch; line-height: 1.5; }

  .frames {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 40px 32px;
  }

  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  figcaption { text-align: center; max-width: 290px; line-height: 1.4; }
  figcaption strong { display: block; font-size: 1.05rem; }
  figcaption span { color: var(--board-muted); font-size: 0.9rem; }

  /* ---------- Moldura de celular ---------- */
  .phone {
    width: 300px;
    max-width: 100%;
    height: 600px;
    border: 10px solid #120d09;
    border-radius: 40px;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    box-shadow: 0 0 0 2px #4a3b2c;
  }

  /* ---------- App (mesmos estilos do plano, em escala de celular) ---------- */
  .game {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px 16px;
    text-align: center;
  }
  .title { margin: 0; font-size: 2.1rem; font-weight: 700; }

  .coin-stage { padding-top: 12px; perspective: 800px; }
  .coin-stage.is-up { transform: translateY(-34px); }

  .coin { position: relative; width: 150px; height: 150px; transform-style: preserve-3d; }
  .coin-face {
    position: absolute; inset: 0;
    border: var(--outline) solid var(--ink);
    border-radius: 50%;
    background: var(--coin);
    box-shadow: inset -9px -9px 0 var(--coin-dark);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .coin-face--coroa { transform: rotateY(180deg); }
  .coin-art { display: block; width: 100%; height: 100%; }

  /* Traços de movimento, só no quadro "girando" */
  .motion { position: relative; }
  .motion::before, .motion::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 22px;
    height: 44px;
    border: 4px solid var(--ink);
    border-color: transparent var(--ink) transparent transparent;
    border-radius: 50%;
    transform: translateY(-80%);
  }
  .motion::before { left: -34px; transform: translateY(-80%) scaleX(-1); }
  .motion::after { right: -34px; }

  .result { margin: 0; min-height: 1.3em; font-size: 1.5rem; font-weight: 700; }

  .flip-button {
    padding: 12px 30px;
    border: var(--outline) solid var(--ink);
    border-radius: 999px;
    background: var(--button);
    color: var(--button-text);
    font: inherit;
    font-size: 1.25rem;
    font-weight: 700;
    box-shadow: 5px 5px 0 var(--ink);
    pointer-events: none;
  }
  .flip-button.is-busy { opacity: 0.6; }

  .history { width: 100%; }
  .history-title { margin: 0 0 8px; color: var(--muted); font-size: 0.95rem; font-weight: 700; }
  .history-list {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 7px;
    min-height: 36px; margin: 0; padding: 0; list-style: none;
  }
  .history-list:empty::before { content: "Nenhuma jogada ainda"; color: var(--muted); }
  .history-item {
    width: 36px; height: 36px;
    border: 3px solid var(--ink);
    border-radius: 50%;
    background: var(--coin);
  }
  .history-item svg { display: block; width: 100%; height: 100%; }
</style>

<svg class="sprite" aria-hidden="true">
  <symbol id="art-cara" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#2b2118" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>
    <circle cx="28" cy="58" r="6" fill="#f28b6b" opacity="0.7"/>
    <circle cx="72" cy="58" r="6" fill="#f28b6b" opacity="0.7"/>
    <circle cx="37" cy="42" r="6" fill="#2b2118"/>
    <circle cx="63" cy="42" r="6" fill="#2b2118"/>
    <path d="M35 60 Q50 76 65 60" fill="none" stroke="#2b2118" stroke-width="6" stroke-linecap="round"/>
  </symbol>
  <symbol id="art-coroa" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#2b2118" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>
    <path d="M28 66 L24 38 L39 51 L50 31 L61 51 L76 38 L72 66 Z" fill="#e0a21b" stroke="#2b2118" stroke-width="5" stroke-linejoin="round"/>
    <rect x="27" y="64" width="46" height="9" rx="3" fill="#e0a21b" stroke="#2b2118" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="24" cy="35" r="4.5" fill="#2b2118"/>
    <circle cx="50" cy="28" r="4.5" fill="#2b2118"/>
    <circle cx="76" cy="35" r="4.5" fill="#2b2118"/>
  </symbol>
</svg>

<header class="board-head">
  <h1>Cara ou Coroa: mockup</h1>
  <p>Três momentos do jogo numa tela de celular. É uma imagem estática: nada aqui é clicável. No app real, a moeda gira por 1,5 s entre o segundo e o terceiro quadro.</p>
</header>

<main class="frames">
  <figure>
    <div class="phone">
      <div class="game">
        <h2 class="title">Cara ou Coroa</h2>
        <div class="coin-stage">
          <div class="coin">
            <div class="coin-face"><svg class="coin-art" viewBox="0 0 100 100"><use href="#art-cara"></use></svg></div>
            <div class="coin-face coin-face--coroa"><svg class="coin-art" viewBox="0 0 100 100"><use href="#art-coroa"></use></svg></div>
          </div>
        </div>
        <p class="result">Clique no botão para jogar!</p>
        <span class="flip-button">Jogar moeda!</span>
        <section class="history">
          <h3 class="history-title">Últimos resultados</h3>
          <ol class="history-list"></ol>
        </section>
      </div>
    </div>
    <figcaption><strong>1. Início</strong><span>A moeda mostra a cara e o histórico está vazio.</span></figcaption>
  </figure>

  <figure>
    <div class="phone">
      <div class="game">
        <h2 class="title">Cara ou Coroa</h2>
        <div class="coin-stage is-up motion">
          <div class="coin" style="transform: rotateY(62deg)">
            <div class="coin-face"><svg class="coin-art" viewBox="0 0 100 100"><use href="#art-cara"></use></svg></div>
            <div class="coin-face coin-face--coroa"><svg class="coin-art" viewBox="0 0 100 100"><use href="#art-coroa"></use></svg></div>
          </div>
        </div>
        <p class="result">Girando...</p>
        <span class="flip-button is-busy">Jogar moeda!</span>
        <section class="history">
          <h3 class="history-title">Últimos resultados</h3>
          <ol class="history-list"><li class="history-item"><svg viewBox="0 0 100 100"><use href="#art-cara"></use></svg></li><li class="history-item"><svg viewBox="0 0 100 100"><use href="#art-cara"></use></svg></li><li class="history-item"><svg viewBox="0 0 100 100"><use href="#art-coroa"></use></svg></li><li class="history-item"><svg viewBox="0 0 100 100"><use href="#art-cara"></use></svg></li><li class="history-item"><svg viewBox="0 0 100 100"><use href="#art-coroa"></use></svg></li><li class="history-item"><svg viewBox="0 0 100 100"><use href="#art-coroa"></use></svg></li></ol>
        </section>
      </div>
    </div>
    <figcaption><strong>2. Girando</strong><span>A moeda sobe e gira, e o botão fica apagado até ela cair.</span></figcaption>
  </figure>

  <figure>
    <div class="phone">
      <div class="game">
        <h2 class="title">Cara ou Coroa</h2>
        <div class="coin-stage">
          <div class="coin" style="transform: rotateY(180deg)">
            <div class="coin-face"><svg class="coin-art" viewBox="0 0 100 100"><use href="#art-cara"></use></svg></div>
            <div class="coin-face coin-face--coroa"><svg class="coin-art" viewBox="0 0 100 100"><use href="#art-coroa"></use></svg></div>
          </div>
        </div>
        <p class="result">Deu COROA!</p>
        <span class="flip-button">Jogar moeda!</span>
        <section class="history">
          <h3 class="history-title">Últimos resultados</h3>
          <ol class="history-list"><li class="history-item"><svg viewBox="0 0 100 100"><use href="#art-coroa"></use></svg></li><li class="history-item"><svg viewBox="0 0 100 100"><use href="#art-cara"></use></svg></li><li class="history-item"><svg viewBox="0 0 100 100"><use href="#art-cara"></use></svg></li><li class="history-item"><svg viewBox="0 0 100 100"><use href="#art-coroa"></use></svg></li><li class="history-item"><svg viewBox="0 0 100 100"><use href="#art-cara"></use></svg></li><li class="history-item"><svg viewBox="0 0 100 100"><use href="#art-coroa"></use></svg></li><li class="history-item"><svg viewBox="0 0 100 100"><use href="#art-coroa"></use></svg></li></ol>
        </section>
      </div>
    </div>
    <figcaption><strong>3. Resultado</strong><span>A moeda para na face sorteada e o resultado entra primeiro na fila (máximo de 10).</span></figcaption>
  </figure>
</main>
